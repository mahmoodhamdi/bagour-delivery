# Notifications API Documentation

paths:
  /notifications:
    get:
      tags:
        - Notifications
      summary: Get user notifications
      description: Retrieve notifications for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [order, promotional, system]
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  unreadCount:
                    type: number
                    example: 5

  /notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Mark a specific notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: تم وضع علامة مقروء

  /notifications/read-all:
    put:
      tags:
        - Notifications
      summary: Mark all as read
      description: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: تم وضع علامة مقروء على جميع الإشعارات

  /notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete notification
      description: Delete a specific notification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: تم حذف الإشعار

  /notifications/settings:
    get:
      tags:
        - Notifications
      summary: Get notification preferences
      description: Get user's notification preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferences retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      orderUpdates:
                        type: boolean
                      promotions:
                        type: boolean
                      newRestaurants:
                        type: boolean
                      systemUpdates:
                        type: boolean
                      emailNotifications:
                        type: boolean
                      pushNotifications:
                        type: boolean

    put:
      tags:
        - Notifications
      summary: Update notification preferences
      description: Update user's notification preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderUpdates:
                  type: boolean
                promotions:
                  type: boolean
                newRestaurants:
                  type: boolean
                systemUpdates:
                  type: boolean
                emailNotifications:
                  type: boolean
                pushNotifications:
                  type: boolean
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: تم تحديث إعدادات الإشعارات

  # Admin Notification Endpoints
  /admin/notifications/send:
    post:
      tags:
        - Admin
        - Notifications
      summary: Send notification (Admin)
      description: Send push notification to users or groups
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
                - recipients
              properties:
                title:
                  type: string
                  example: عرض خاص
                titleAr:
                  type: string
                  example: عرض خاص
                body:
                  type: string
                  example: احصل على خصم 20% على طلبك القادم
                bodyAr:
                  type: string
                  example: احصل على خصم 20% على طلبك القادم
                type:
                  type: string
                  enum: [order, promotional, system]
                  default: promotional
                recipients:
                  type: object
                  properties:
                    userIds:
                      type: array
                      items:
                        type: string
                      description: Specific user IDs
                    role:
                      type: string
                      enum: [customer, restaurant, driver, all]
                      description: Send to all users with specific role
                    segment:
                      type: string
                      enum: [active, inactive, new, vip]
                data:
                  type: object
                  description: Additional data payload
                  properties:
                    screen:
                      type: string
                    params:
                      type: object
                imageUrl:
                  type: string
                  format: uri
                scheduledFor:
                  type: string
                  format: date-time
                  description: Schedule notification for later
      responses:
        '200':
          description: Notification sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: تم إرسال الإشعار بنجاح
                  data:
                    type: object
                    properties:
                      totalSent:
                        type: number
                        example: 150
                      scheduled:
                        type: boolean

  /admin/notifications/history:
    get:
      tags:
        - Admin
        - Notifications
      summary: Get notification history (Admin)
      description: View all sent notifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [sent, scheduled, failed]
      responses:
        '200':
          description: History retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        body:
                          type: string
                        type:
                          type: string
                        totalRecipients:
                          type: number
                        sentAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                  pagination:
                    $ref: '#/components/schemas/Pagination'
