name: "Setup pnpm + Node"
description: "Install pnpm via Corepack, set up Node, restore the pnpm store cache, and run `pnpm install`."

inputs:
  node-version:
    description: "Node major version (matches .nvmrc by default)"
    required: false
    default: "22"
  install:
    description: "Whether to run pnpm install"
    required: false
    default: "true"
  frozen-lockfile:
    description: "Whether to enforce lockfile parity"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Enable Corepack
      shell: bash
      run: |
        corepack enable
        corepack prepare --activate

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
